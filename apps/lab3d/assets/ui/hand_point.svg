<svg xmlns="http://www.w3.org/2000/svg" width="192" height="264" viewBox="0 0 96 132">
  <!-- The hand guide's pointing hand (HandGuide): a white glove, the island's brown outline
       (ArtPalette.OUTLINE #6e4630), the index fingertip at (34, 6). The outline is the same shapes
       drawn wider underneath, so the glove reads as one piece. -->
  <g fill="#6e4630" stroke="#6e4630" stroke-width="7" stroke-linejoin="round">
    <rect x="23" y="4" width="23" height="72" rx="11.5"/>
    <rect x="14" y="54" width="58" height="60" rx="24"/>
    <rect x="42" y="50" width="30" height="24" rx="12"/>
    <rect x="46" y="68" width="30" height="22" rx="11"/>
    <rect x="45" y="84" width="27" height="20" rx="10"/>
    <rect x="2" y="62" width="21" height="40" rx="10.5" transform="rotate(-28 12 82)"/>
    <rect x="20" y="106" width="46" height="22" rx="7"/>
  </g>
  <g fill="#ffffff">
    <rect x="23" y="4" width="23" height="72" rx="11.5"/>
    <rect x="14" y="54" width="58" height="60" rx="24"/>
    <rect x="42" y="50" width="30" height="24" rx="12"/>
    <rect x="46" y="68" width="30" height="22" rx="11"/>
    <rect x="45" y="84" width="27" height="20" rx="10"/>
    <rect x="2" y="62" width="21" height="40" rx="10.5" transform="rotate(-28 12 82)"/>
  </g>
  <!-- A soft shade on the palm's lower side and the cuff. -->
  <path d="M18 92 Q22 112 44 112 Q62 112 70 98 Q66 106 46 106 Q26 106 18 92 Z" fill="#e4ebf5"/>
  <rect x="20" y="106" width="46" height="22" rx="7" fill="#8fbaf7"/>
  <rect x="20" y="106" width="46" height="7" rx="3.5" fill="#b9d4fb"/>
  <!-- Folds between the bent fingers, the thumb's edge, the cuff seam. -->
  <g fill="none" stroke="#6e4630" stroke-width="2.6" stroke-linecap="round">
    <path d="M50 71 H69"/>
    <path d="M52 86.5 H71"/>
    <path d="M24 74 Q31 84 26 97"/>
    <path d="M21 106.5 H65"/>
  </g>
  <!-- A little shine on the pointing finger. -->
  <ellipse cx="30" cy="20" rx="2.6" ry="7" fill="#e4ebf5"/>
</svg>

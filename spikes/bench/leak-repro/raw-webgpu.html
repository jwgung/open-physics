<!doctype html>
<html><body style="margin:0;background:#000">
<canvas id="c" style="width:100vw;height:100vh"></canvas>
<div id="s" style="position:fixed;top:0;color:#fff">fps</div>
<script type="module">
// Minimal WebGPU loop for the Android WebView leak repro. MODE: clear | write | draw
const MODE = new URLSearchParams(location.hash.slice(1)).get("mode") ?? "clear";
const canvas = document.getElementById("c");
canvas.width = innerWidth * devicePixelRatio;
canvas.height = innerHeight * devicePixelRatio;
const adapter = await navigator.gpu.requestAdapter({ featureLevel: "compatibility" });
const device = await adapter.requestDevice();
const ctx = canvas.getContext("webgpu");
const format = navigator.gpu.getPreferredCanvasFormat();
ctx.configure({ device, format, alphaMode: "opaque" });
const ubo = device.createBuffer({ size: 256, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
const module = device.createShaderModule({ code: `
  @group(0) @binding(0) var<uniform> u: vec4f;
  @vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
    let p = array(vec2f(0, .5), vec2f(-.5, -.5), vec2f(.5, -.5));
    return vec4f(p[i] + u.xy, 0, 1);
  }
  @fragment fn fs() -> @location(0) vec4f { return vec4f(1, .5, 0, 1); }` });
const pipeline = device.createRenderPipeline({ layout: "auto", vertex: { module }, fragment: { module, targets: [{ format }] } });
const bind = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: ubo } }] });
const data = new Float32Array(64);
let frames = 0, last = performance.now();
function frame(t) {
  if (MODE !== "clear") { data[0] = Math.sin(t / 500) * 0.3; device.queue.writeBuffer(ubo, 0, data); }
  const enc = device.createCommandEncoder();
  const pass = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: "clear", storeOp: "store", clearValue: { r: 0, g: 0, b: .2, a: 1 } }] });
  if (MODE === "draw") { pass.setPipeline(pipeline); pass.setBindGroup(0, bind); pass.draw(3); }
  pass.end();
  device.queue.submit([enc.finish()]);
  frames++;
  if (t - last > 1000) { document.getElementById("s").textContent = `raw-${MODE} ${(frames * 1000 / (t - last)).toFixed(1)} fps`; frames = 0; last = t; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
